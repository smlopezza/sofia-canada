{% extends "base.html" %}

{% block title %}SofIA — {% if lang == 'es' %}Salir del directorio{% else %}Leave the directory{% endif %}{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-md-6 offset-md-3 text-center">
      <div class="card p-4">
        <p class="stat-number mb-2">✓</p>
        <p class="mission-text">{{ message }}</p>
        <a href="/mentors?lang={{ lang }}" class="btn btn-teal btn-sm mt-3">
          {% if lang == 'es' %}Ver el directorio{% else %}View the directory{% endif %}
        </a>
      </div>
    </div>
  </div>
{% endblock %}
